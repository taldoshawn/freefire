name: Reconstruir APK a partir dos ZIPs originais

on:
  workflow_dispatch:
    inputs:
      input_tag:
        description: "Release que contém os arquivos originais"
        type: string
        default: inputs
        required: true

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK/NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME"
          sdkmanager_bin="$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          test -n "$sdkmanager_bin"
          echo "$(dirname "$sdkmanager_bin")" >> "$GITHUB_PATH"
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          echo "NDK=$SDK/ndk/26.3.11579264" >> "$GITHUB_ENV"
          "$sdkmanager_bin" --install "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264"

      - name: Compilar módulo ARM64
        shell: bash
        run: |
          set -euo pipefail
          cmake -S android/native -B build/arm64 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static
          cmake --build build/arm64 --parallel 2
          mkdir -p build/java-classes build/dex
          find android/java -name '*.java' -print0 | xargs -0 javac \
            --release 8 -cp "$SDK/platforms/android-35/android.jar" \
            -d build/java-classes
          find build/java-classes -name '*.class' -print0 | xargs -0 \
            "$SDK/build-tools/35.0.0/d8" --min-api 26 \
            --lib "$SDK/platforms/android-35/android.jar" --output build/dex

      - name: Baixar os dois arquivos que já estão no celular
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.input_tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input
          gh release download "$INPUT_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "free-fire-1-132-1..apk" \
            --pattern "ff2.zip" \
            --dir input
          test -s input/free-fire-1-132-1..apk
          test -s input/ff2.zip

      - name: Repor bibliotecas ARM64 no APK fornecido
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil, zipfile
          base = Path("input/free-fire-1-132-1..apk")
          libs = Path("input/ff2.zip")
          output = Path("build/original-arm64-reconstructed.apk")
          output.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(base, output)
          with zipfile.ZipFile(base) as source, zipfile.ZipFile(libs) as libsrc:
              names = set(source.namelist())
              required = {"AndroidManifest.xml", "resources.arsc", "classes.dex",
                          "assets/bin/Data/boot.config"}
              assert required <= names, f"APK parcial inválido: {required - names}"
              entries = [e for e in libsrc.infolist()
                         if e.filename.startswith("arm64-v8a/") and e.filename.endswith(".so")]
              assert len(entries) == 27, f"Esperadas 27 bibliotecas ARM64, existem {len(entries)}"
              with zipfile.ZipFile(output, "a", allowZip64=True) as target:
                  for entry in entries:
                      destination = "lib/" + entry.filename
                      if destination in names:
                          continue
                      with libsrc.open(entry) as src, target.open(destination, "w",
                            force_zip64=False) as dst:
                          shutil.copyfileobj(src, dst, length=1024*1024)
          print(f"Reconstrução concluída: {output.stat().st_size:,} bytes")
          PY

      - name: Baixar Apktool
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          url="$(gh api repos/iBotPeaches/Apktool/releases/latest \
            --jq '.assets[] | select(.name | test("^apktool_.*\\.jar$")) | .browser_download_url' \
            | head -n 1)"
          test -n "$url"
          curl -fL --retry 3 "$url" -o build/apktool.jar

      - name: Montar e assinar APK de diagnóstico
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_apk.py \
            --apk build/original-arm64-reconstructed.apk \
            --dex build/dex/classes.dex \
            --so build/arm64/libnox_esp.so \
            --apktool build/apktool.jar \
            --output build/nox-unsigned.apk
          "$SDK/build-tools/35.0.0/zipalign" -f 4 build/nox-unsigned.apk build/nox-aligned.apk
          keytool -genkeypair -noprompt -keystore build/nox-test.jks \
            -alias nox -keyalg RSA -keysize 3072 -validity 365 \
            -storepass changeit -keypass changeit -dname "CN=NOX Test"
          "$SDK/build-tools/35.0.0/apksigner" sign \
            --ks build/nox-test.jks --ks-key-alias nox \
            --ks-pass pass:changeit --key-pass pass:changeit \
            --out build/NOX-FF-OB55-runtime-probe.apk build/nox-aligned.apk
          "$SDK/build-tools/35.0.0/apksigner" verify --verbose \
            build/NOX-FF-OB55-runtime-probe.apk

      - name: Anexar APK inteiro nos Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NOX-FF-OB55-diagnostic-apk
          path: build/NOX-FF-OB55-runtime-probe.apk
          if-no-files-found: error

      - name: Publicar Release com o APK inteiro
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="nox-ff-ob55-built"
          apk="build/NOX-FF-OB55-runtime-probe.apk"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$apk" --repo "$GITHUB_REPOSITORY" \
              --title "NOX FF OB55 — Diagnóstico ARM64" \
              --notes "APK de diagnóstico Android ARM64. Ainda não contém leitor de entidades ou ESP funcional."
          fi
