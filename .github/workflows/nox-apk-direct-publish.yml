name: Publicar NOX FF APK completo (transferência Dropbox)

on:
  push:
    paths:
      - ".github/workflows/nox-apk-direct-publish.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Baixar as sete partes do Dropbox
        shell: bash
        env:
          U00: ""
          U01: ""
          U02: ""
          U03: ""
          U04: ""
          U05: ""
          U06: ""
        run: |
          set -euo pipefail
          mkdir -p /tmp/noxparts
          for i in 00 01 02 03 04 05 06; do
            variable="U${i}"
            encoded="${!variable}"
            url="$(printf '%s' "$encoded" | base64 --decode)"
            echo "Baixando parte $i"
            curl --fail --location --silent --show-error \
              --connect-timeout 30 --max-time 500 \
              --output "/tmp/noxparts/part$i" "$url"
          done
          test "$(stat -c '%s' /tmp/noxparts/part00)" = "73400320"
          test "$(stat -c '%s' /tmp/noxparts/part01)" = "73400320"
          test "$(stat -c '%s' /tmp/noxparts/part02)" = "73400320"
          test "$(stat -c '%s' /tmp/noxparts/part03)" = "73400320"
          test "$(stat -c '%s' /tmp/noxparts/part04)" = "73400320"
          test "$(stat -c '%s' /tmp/noxparts/part05)" = "73400320"
          test "$(stat -c '%s' /tmp/noxparts/part06)" = "36870251"
          cat /tmp/noxparts/part* > /tmp/NOX-FF-OB55-runtime-probe.apk
          test "$(stat -c '%s' /tmp/NOX-FF-OB55-runtime-probe.apk)" = "477272171"
          echo "c39fb021e9e16be270977d81eb77f8a6995f4bbbed7f8eaa979c00bf3ac149d1  /tmp/NOX-FF-OB55-runtime-probe.apk" | sha256sum -c -
          echo "APK completo verificado por SHA-256"

      - name: Publicar APK em uma Release (um arquivo)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          apk="/tmp/NOX-FF-OB55-runtime-probe.apk"
          tag="nox-ff-ob55-diagnostic-complete"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$apk" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "NOX FF OB55 — APK de diagnóstico completo" \
              --notes "Arquivo Android ARM64 de diagnóstico IL2CPP. 477272171 bytes, SHA-256 c39fb021e9e16be270977d81eb77f8a6995f4bbbed7f8eaa979c00bf3ac149d1. Não é ESP funcional."
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,assets --jq '.url, (.assets[] | "\(.name) \(.size) bytes")'
